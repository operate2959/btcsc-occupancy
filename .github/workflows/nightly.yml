name: Nightly merge and aggregates

# 23:23 Taipei, after the last collection window (ends 22:51).
on:
  schedule:
    - cron: "23 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Merge today's runs into the monthly files
        run: python3 scripts/merge_raw.py

      - name: Build dashboard tables
        run: |
          python3 analysis/build_aggregates.py
          python3 analysis/export_recent.py

      - name: Weekly class timetable (Mondays)
        run: |
          if [ "$(TZ=Asia/Taipei date +%u)" = "1" ]; then python3 collector/classes.py || echo "timetable fetch failed"; fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data logs analysis/out classes
          git diff --cached --quiet && exit 0
          git commit -q -m "nightly merge $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
