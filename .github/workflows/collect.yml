name: Collect occupancy

# Samples the btcsc.cyc.org.tw live counter once a minute, 05:50-22:51 Taipei.
# A scheduled workflow can't run every minute, so each run loops inside itself
# for up to 5h45m (a job may run 6h max).
# GitHub often starts scheduled runs hours late, or drops them, so a run is
# triggered every hour and the window is worked out from when a run actually
# starts, not from which trigger fired. The concurrency group lets only one run
# sample at a time; the next one waits and takes over when it finishes.
# Runs append to data/raw/<date>_1.csv; the nightly workflow merges it into
# data/YYYY-MM.csv.

on:
  schedule:
    - cron: "17 20-23 * * *"   # 04:17-07:17 Taipei
    - cron: "17 0-14 * * *"    # 08:17-22:17 Taipei
  workflow_dispatch:
    inputs:
      from:
        description: "Start (Taipei HH:MM, blank = now)"
        required: false
      to:
        description: "Stop (Taipei HH:MM)"
        required: true
        default: "22:51"
      always:
        description: "Sample even outside opening hours (for testing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Pick the time window
        id: win
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "from=${{ inputs.from }}" >> $GITHUB_OUTPUT
            echo "to=${{ inputs.to }}" >> $GITHUB_OUTPUT
            echo "tag=m${{ github.run_id }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Minutes since midnight, Taipei time.
          now=$(( 10#$(TZ=Asia/Taipei date +%H) * 60 + 10#$(TZ=Asia/Taipei date +%M) ))
          open=$(( 5 * 60 + 50 )); close=$(( 22 * 60 + 51 ))
          end=$(( now + 345 )); [ $end -gt $close ] && end=$close
          if [ $now -ge $close ]; then echo "skip=1" >> $GITHUB_OUTPUT; exit 0; fi
          from=""; [ $now -lt $open ] && from="05:50"
          echo "from=$from" >> $GITHUB_OUTPUT
          printf 'to=%02d:%02d\n' $(( end / 60 )) $(( end % 60 )) >> $GITHUB_OUTPUT
          echo "tag=1" >> $GITHUB_OUTPUT

      - name: Sample once a minute and commit every 10 minutes
        if: steps.win.outputs.skip != '1'
        env:
          FROM: ${{ steps.win.outputs.from }}
          TO: ${{ steps.win.outputs.to }}
          TAG: ${{ steps.win.outputs.tag }}
          ALWAYS: ${{ inputs.always }}
        run: bash scripts/run_window.sh
